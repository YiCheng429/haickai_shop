<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="月光手鍊示意圖">
  <defs>
    <linearGradient id="bb" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF7F2"/>
      <stop offset="100%" stop-color="#EDD6C8"/>
    </linearGradient>
    <linearGradient id="goldb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8E6B8"/>
      <stop offset="50%" stop-color="#D4B06A"/>
      <stop offset="100%" stop-color="#9A6C32"/>
    </linearGradient>
    <radialGradient id="pearl" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="60%" stop-color="#F3E4D0"/>
      <stop offset="100%" stop-color="#D9B896"/>
    </radialGradient>
    <radialGradient id="roseg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFE8E4"/>
      <stop offset="100%" stop-color="#D47A80"/>
    </radialGradient>
    <filter id="softb" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#C9A15A" flood-opacity=".2"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="36" fill="url(#bb)"/>
  <ellipse cx="200" cy="200" rx="148" ry="118" fill="none" stroke="#E8D5A8" stroke-width="1" opacity=".7"/>
  <!-- bracelet oval -->
  <g filter="url(#softb)">
    <ellipse cx="200" cy="200" rx="118" ry="86" fill="none" stroke="url(#goldb)" stroke-width="10"/>
    <ellipse cx="200" cy="200" rx="108" ry="76" fill="none" stroke="#F8E6B8" stroke-width="1.2" opacity=".7"/>
    <!-- clasp -->
    <rect x="302" y="186" width="28" height="28" rx="8" fill="url(#goldb)" transform="rotate(18 316 200)"/>
    <rect x="308" y="192" width="16" height="16" rx="4" fill="#F8E6B8" opacity=".55" transform="rotate(18 316 200)"/>
  </g>
  <!-- charms -->
  <g>
    <circle cx="200" cy="286" r="16" fill="url(#pearl)" stroke="#C9A15A" stroke-width="1.4"/>
    <path d="M200 270v10" stroke="#C9A15A" stroke-width="2"/>
    <circle cx="126" cy="248" r="11" fill="url(#roseg)" stroke="#C9A15A" stroke-width="1.2"/>
    <path d="M132 236l-6 8" stroke="#C9A15A" stroke-width="1.6"/>
    <circle cx="274" cy="248" r="11" fill="url(#pearl)" stroke="#C9A15A" stroke-width="1.2"/>
    <path d="M268 236l6 8" stroke="#C9A15A" stroke-width="1.6"/>
    <!-- tiny moon charm -->
    <path d="M200 108c8 0 14 8 14 16 0 10-8 16-16 16 6-2 10-8 10-16 0-8-4-14-8-16z" fill="url(#goldb)"/>
    <path d="M200 124v-16" stroke="#C9A15A" stroke-width="1.8"/>
  </g>
  <g fill="#C9A15A">
    <path d="M78 92l2 4.6 4.8.6-3.6 3.2 1.1 4.8L78 103l-4.3 2.4 1.1-4.8-3.6-3.2 4.8-.6z" opacity=".8"/>
    <path d="M322 300l1.5 3.4 3.6.5-2.7 2.3.8 3.5-3.2-1.9-3.2 1.9.8-3.5-2.7-2.3 3.6-.5z" opacity=".7"/>
    <circle cx="70" cy="210" r="1.8" opacity=".45"/>
    <circle cx="340" cy="140" r="1.6" opacity=".4"/>
  </g>
</svg>
