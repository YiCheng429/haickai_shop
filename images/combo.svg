<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="微光綜合盲盒示意圖">
  <defs>
    <linearGradient id="cb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8F2"/>
      <stop offset="100%" stop-color="#F0D0C8"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBE4DF"/>
      <stop offset="100%" stop-color="#E8B0AA"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8EDE8"/>
      <stop offset="100%" stop-color="#E8C4BE"/>
    </linearGradient>
    <linearGradient id="goldc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8E6B8"/>
      <stop offset="50%" stop-color="#D4B06A"/>
      <stop offset="100%" stop-color="#8E6230"/>
    </linearGradient>
    <linearGradient id="rib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A15A"/>
      <stop offset="50%" stop-color="#F3E0A8"/>
      <stop offset="100%" stop-color="#C9A15A"/>
    </linearGradient>
    <filter id="softc" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#8E6230" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="36" fill="url(#cb)"/>
  <circle cx="200" cy="200" r="148" fill="none" stroke="#E8D5A8" stroke-width="1" opacity=".7"/>
  <!-- box body -->
  <g filter="url(#softc)">
    <rect x="96" y="168" width="208" height="148" rx="10" fill="url(#box)" stroke="#C9A15A" stroke-width="1.4"/>
    <!-- vertical ribbon on body -->
    <rect x="184" y="168" width="32" height="148" fill="url(#rib)" opacity=".92"/>
    <!-- lid slightly open / sitting on top -->
    <rect x="86" y="132" width="228" height="48" rx="8" fill="url(#lid)" stroke="#C9A15A" stroke-width="1.4"/>
    <rect x="86" y="168" width="228" height="8" fill="#E0B8B2"/>
    <rect x="184" y="132" width="32" height="48" fill="url(#rib)"/>
    <!-- bow -->
    <path d="M200 112 C 168 86, 142 118, 168 138 C 184 148, 196 136, 200 124 C 204 136, 216 148, 232 138 C 258 118, 232 86, 200 112 Z" fill="url(#goldc)"/>
    <circle cx="200" cy="126" r="8" fill="#F8E6B8" stroke="#8E6230" stroke-width="1"/>
    <!-- tails -->
    <path d="M192 132 L176 172 L196 148 Z" fill="url(#goldc)"/>
    <path d="M208 132 L224 172 L204 148 Z" fill="url(#goldc)"/>
  </g>
  <!-- peeking jewelry -->
  <circle cx="140" cy="214" r="12" fill="#F3E4D0" stroke="#C9A15A" stroke-width="1.2"/>
  <circle cx="260" cy="218" r="9" fill="#E8A8A4" stroke="#C9A15A" stroke-width="1"/>
  <path d="M200 196c-18 18-18 40 0 40 18-2 22-18 14-28-4 8-10 12-14 12-8 0-14-12-0-24z" fill="url(#goldc)"/>
  <g fill="#C9A15A">
    <path d="M80 84l2 4.6 4.8.6-3.6 3.2 1.1 4.8L80 95l-4.3 2.4 1.1-4.8-3.6-3.2 4.8-.6z"/>
    <path d="M324 96l1.5 3.4 3.6.5-2.7 2.3.8 3.5-3.2-1.9-3.2 1.9.8-3.5-2.7-2.3 3.6-.5z" opacity=".8"/>
    <path d="M330 300l1.2 2.8 3 .4-2.3 2 .7 2.9-2.6-1.5-2.6 1.5.7-2.9-2.3-2 3-.4z" opacity=".65"/>
  </g>
</svg>
