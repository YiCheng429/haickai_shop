<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="晨露戒指示意圖">
  <defs>
    <linearGradient id="rb" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#F6E0DA"/>
      <stop offset="100%" stop-color="#FFF8F4"/>
    </linearGradient>
    <linearGradient id="goldr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8E6B8"/>
      <stop offset="50%" stop-color="#D4B06A"/>
      <stop offset="100%" stop-color="#8E6230"/>
    </linearGradient>
    <radialGradient id="gemr" cx="38%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#FFF7F4"/>
      <stop offset="40%" stop-color="#F0A8A8"/>
      <stop offset="100%" stop-color="#B85A66"/>
    </radialGradient>
    <filter id="softr" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#C9A15A" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="36" fill="url(#rb)"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="#E8D5A8" stroke-width="1" opacity=".75"/>
  <circle cx="200" cy="208" r="88" fill="#FBECE7" opacity=".5"/>
  <!-- band -->
  <g filter="url(#softr)">
    <ellipse cx="200" cy="230" rx="86" ry="70" fill="none" stroke="url(#goldr)" stroke-width="16"/>
    <ellipse cx="200" cy="230" rx="74" ry="58" fill="none" stroke="#F8E6B8" stroke-width="2" opacity=".55"/>
    <!-- inner hole suggestion -->
    <ellipse cx="200" cy="238" rx="58" ry="42" fill="none" stroke="#C9A15A" stroke-width="1" opacity=".25"/>
  </g>
  <!-- setting + stone -->
  <g filter="url(#softr)">
    <path d="M200 108 L222 148 L200 140 L178 148 Z" fill="url(#goldr)"/>
    <circle cx="200" cy="128" r="28" fill="url(#gemr)" stroke="#C9A15A" stroke-width="2"/>
    <path d="M200 104 L214 128 L200 152 L186 128 Z" fill="#fff" opacity=".28"/>
    <circle cx="190" cy="118" r="5" fill="#fff" opacity=".55"/>
    <!-- side stones -->
    <circle cx="164" cy="150" r="8" fill="url(#gemr)" stroke="#C9A15A" stroke-width="1"/>
    <circle cx="236" cy="150" r="8" fill="url(#gemr)" stroke="#C9A15A" stroke-width="1"/>
  </g>
  <g fill="#C9A15A">
    <path d="M96 86l2.2 5 5.2.7-4 3.4 1.2 5.1L96 97.6 91.4 100.3l1.2-5.1-4-3.4 5.2-.7z"/>
    <path d="M312 86l1.6 3.6 3.8.5-2.9 2.4.9 3.7-3.4-2-3.4 2 .9-3.7-2.9-2.4 3.8-.5z" opacity=".75"/>
    <path d="M318 280l1.2 2.8 3 .4-2.3 2 .7 2.9-2.6-1.5-2.6 1.5.7-2.9-2.3-2 3-.4z" opacity=".7"/>
  </g>
</svg>
